name: Free gateway bundle

# Builds the free-model gateway (LiteLLM + a keyless config) into quchen-gateway.zip and attaches it to a
# release, so the app can install it in one click instead of needing a checkout on the person's disk.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release to attach to (default: the latest)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create the virtualenv and install LiteLLM
        shell: pwsh
        run: |
          python -m venv gw\.venv
          gw\.venv\Scripts\python.exe -m pip install --upgrade pip --index-url https://pypi.tuna.tsinghua.edu.cn/simple
          gw\.venv\Scripts\python.exe -m pip install "litellm[proxy]" --index-url https://pypi.tuna.tsinghua.edu.cn/simple
          gw\.venv\Scripts\litellm.exe --version

      - name: Lay out the bundle
        shell: pwsh
        run: |
          Copy-Item gateway\litellm-config.yaml gw\litellm-config.yaml
          Copy-Item gateway\.env gw\.env
          Get-ChildItem gw | Select-Object Name

      - name: Zip it
        shell: pwsh
        run: |
          Compress-Archive -Path gw\* -DestinationPath quchen-gateway.zip -CompressionLevel Optimal
          (Get-Item quchen-gateway.zip).Length / 1MB

      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TO="${{ inputs.tag }}"
          if [ -z "$TO" ]; then TO=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          echo "attaching to $TO"
          gh release upload "$TO" quchen-gateway.zip --clobber
          gh release view "$TO" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep gateway
