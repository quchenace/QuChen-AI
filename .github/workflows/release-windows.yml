name: Windows installer

# Builds the Windows installer (NSIS, per-user) and publishes it with the Tauri updater manifest (latest.json),
# so an installed QuChen finds the next version and installs it. Run from the Actions tab, or push a v* tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.11 (default: the version in the sources)"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) {
            $cargo = Get-Content apps/desktop/src-tauri/Cargo.toml -Raw
            $v = ([regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          }
          if (-not $v) { throw "no version" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Web UI
        shell: pwsh
        run: |
          npm ci --prefix apps/host
          npm run build --prefix apps/host

      - name: Node sidecar for the bundled host
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/desktop/scripts/fetch-node.ps1

      - name: Control bundle (Python runtime, wheels, quchen_cli/quchen_control/serve)
        shell: pwsh
        run: python apps/desktop/scripts/stage-control.py

      - name: Desktop dependencies
        shell: pwsh
        run: npm ci --prefix apps/desktop

      - name: Stage the agent component (DeepSeek Harness, MIT, from npm)
        shell: pwsh
        run: |
          $dest = "apps/desktop/src-tauri/resources/harness"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Push-Location $dest
          '{ "name": "quchen-harness", "private": true }' | Set-Content package.json -Encoding utf8
          npm install "@deepseek-ai/dsh@0.2.2-rc.1" --omit=dev --no-audit --no-fund
          Move-Item "node_modules/@deepseek-ai/dsh/*" . -Force
          node lib/bin.js --version
          Pop-Location

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: "QuChen ${{ steps.ver.outputs.version }}"
          releaseBody: |
            QuChen ${{ steps.ver.outputs.version }} · Windows 安装包

            更新说明

            新增与修复
            1. 免费网关增加故障转移与健康过滤：上游失败时尝试其它可用线路，同步到 DSH 的模型列表排除当前不可用通道；
               网关晚启动或手动启动后自动补注册，新对话会继承已选择的网关模型。
            2. 模型与对话：网关模型支持思考力度；自定义 OpenAI 兼容服务可添加并直接对话；API 模型在侧栏和对话页正确显示为可用。
            3. 应用更新：强制更新页可直接打开下载页，安装流程显示下载进度与后续状态；安装包线路与进程识别修复，
               更新 QuChen 不会关闭或卸载 QuChen VPN。
            4. QUCHEN Radio 集成：网关页新增独立下载、安装、启动与停止入口；Radio 的 AI 对话改用 QuChen-AI 的模型 API，
               不再启动第二套 AI 服务；Radio 与 VPN 的下载进度分别显示。网关页精简为免费网关、Radio、VPN 三项，
               移除旧 Harness、OpenCode/Bun 与暂停模型控制。
            5. QuChen VPN 集成：保留安装包 SHA-256 校验、并行下载和本地安装包入口，并修复静默安装参数与安装目录识别。

            本次同时发布 QUCHEN Radio 3.0.0 与 QuChen VPN 1.0.12。
          releaseDraft: false
          prerelease: false
          args: >-
            --config src-tauri/tauri.release.conf.json
            --config src-tauri/tauri.update.conf.json
            --bundles nsis

      - name: Publish the one-line installer and its checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $exe = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "no installer was built" }
          $hash = (Get-FileHash -Algorithm SHA256 "$($exe.FullName)").Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA256SUMS.txt: $((Get-Content SHA256SUMS.txt) -join '')"
          gh release upload $tag SHA256SUMS.txt install-app.ps1 install-app.cmd --clobber

      - name: Carry the engine feed and archives into this release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TO="${{ steps.ver.outputs.tag }}"
          FROM=""
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName -q '.[].tagName'); do
            if [ "$t" = "$TO" ]; then continue; fi
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx 'quchen-feed.json'; then FROM="$t"; break; fi
          done
          echo "carrying the engine assets from $FROM into $TO"
          if [ -z "$FROM" ]; then echo "::warning::no earlier release carries quchen-feed.json"; exit 0; fi
          mkdir -p carry
          gh release download "$FROM" --repo "$GITHUB_REPOSITORY" --pattern 'quchen-*' --dir carry
          gh release upload "$TO" carry/* --clobber
          echo "carried $(ls carry | wc -l) files"
