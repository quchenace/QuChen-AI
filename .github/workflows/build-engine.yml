name: Engine packages (Windows)

# Builds a CUDA engine package for the update feed: the per-card quchen.exe and its CUDA libraries,
# packaged by packaging/package_engine.py. Compiling CUDA needs the toolkit, not a GPU, so a hosted runner can do it.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'JSON list of variants, e.g. ["cuda13","cuda12"]'
        default: '["cuda13"]'

permissions:
  contents: write

jobs:
  engine:
    name: ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@v4

      - name: Variant settings
        id: p
        shell: pwsh
        run: |
          switch ("${{ matrix.variant }}") {
            "cuda13" { $cuda = "13.3.0"; $archs = "75;86;89;120"; $sm60 = "OFF"; $mind = "580.65"; $dsv41 = "ON" }
            "cuda12" { $cuda = "12.9.0"; $archs = "60;61;70;75;80;86;89"; $sm60 = "ON"; $mind = "575.51"; $dsv41 = "OFF" }
            default  { throw "unknown variant ${{ matrix.variant }}" }
          }
          "cuda=$cuda" >> $env:GITHUB_OUTPUT
          "archs=$archs" >> $env:GITHUB_OUTPUT
          "sm60=$sm60" >> $env:GITHUB_OUTPUT
          "mindriver=$mind" >> $env:GITHUB_OUTPUT
          "dsv41=$dsv41" >> $env:GITHUB_OUTPUT

      - name: Visual Studio 2022 Build Tools (CUDA 12 does not support VS 2026)
        if: matrix.variant == 'cuda12'
        shell: pwsh
        run: choco install visualstudio2022buildtools --no-progress -y --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet --wait"

      - name: Use VS 2022 for cuda12
        if: matrix.variant == 'cuda12'
        shell: pwsh
        run: |
          $vcvars = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "VS 2022 Build Tools not installed" }
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Add-Content -Path $env:GITHUB_ENV -Value ($matches[1] + '=' + $matches[2]) }
          }

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.variant != 'cuda12'

      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ steps.p.outputs.cuda }}
          method: network
          use-github-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tools and the pinned llama.cpp
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements-build.txt
          python -c "import setup; print(setup.get_llama_cpp())"

      - name: Configure
        shell: pwsh
        run: |
          $ggml = Join-Path (Get-Location) "third_party\llama.cpp"
          Write-Host "llama.cpp at $ggml"
          $archs = "${{ steps.p.outputs.archs }}" -split ";"
          $real = ($archs | ForEach-Object { "$_-real" }) -join ";"
          $cudaArch = "$real;$($archs[-1])-virtual"
          Write-Host "CUDA architectures: $cudaArch"
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DQUCHEN_ENABLE_CUDA=ON -DQUCHEN_BUILD_TESTS=OFF -DQUCHEN_EXPERIMENTAL_SM60=${{ steps.p.outputs.sm60 }} -DQUCHEN_BUILD_DSV41=${{ steps.p.outputs.dsv41 }} -DQUCHEN_NATIVE_EXPERTS=ON -DQUCHEN_PORTABLE=ON -DQUCHEN_Q6K_EXPERTS=ON -DQUCHEN_MMQ_KQUANTS=ON "-DCMAKE_CUDA_ARCHITECTURES=$cudaArch" "-DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler" "-DQUCHEN_GGML_DIR=$ggml"

      - name: Build the engine
        shell: pwsh
        run: |
          cmake --build build --target quchen -j 4
          # The DeepSeek-V4.1 engine (quchen-dsv41) ships INSIDE the CUDA 13 package: the same CUDA 13 toolchain sm_120 needs, and setup.py
          # looks for it beside the engine and in the app's installed engine package. The CUDA 12 package has no DeepSeek path.
          if ("${{ steps.p.outputs.dsv41 }}" -eq "ON") { cmake --build build --target quchen-dsv41 -j 4 }

      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.variant }}
          path: build/quchen.exe
          include-hidden-files: true
          if-no-files-found: error

      - name: Package
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern "project\(quchen VERSION ([0-9.]+)").Matches[0].Groups[1].Value
          if (-not $ver) { throw "no version in CMakeLists.txt" }
          $stage = "stage-${{ matrix.variant }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/quchen.exe $stage/
          if ("${{ steps.p.outputs.dsv41 }}" -eq "ON") { Copy-Item build/quchen-dsv41.exe $stage/ }
          $archs = "${{ steps.p.outputs.archs }}"
          @{ version = $ver; source = "build-engine.yml"; archs = $archs; cuda = "${{ steps.p.outputs.cuda }}"; portable = $true; dsv41 = ("${{ steps.p.outputs.dsv41 }}" -eq "ON") } | ConvertTo-Json | Set-Content "$stage/BUILD.json" -Encoding utf8
          $archArgs = @()
          foreach ($a in ($archs -split ";")) { $archArgs += @("--arch", "sm_$a") }
          $last = ($archs -split ";")[-1]
          $req = if ("${{ steps.p.outputs.dsv41 }}" -eq "ON") { "--require-dsv41" } else { "" }
          python packaging/package_engine.py --src $stage --backend cuda --version $ver --out out-engine @archArgs --arch "compute_$last" --min-driver nvidia=${{ steps.p.outputs.mindriver }} --variant ${{ matrix.variant }} --platform windows-x86_64 --build-id "gha-$ver-${{ matrix.variant }}" $req
          Get-ChildItem out-engine -Recurse | Select-Object FullName,Length

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.variant }}
          path: out-engine/**
          include-hidden-files: true
          if-no-files-found: error

