name: Engine packages (Windows)

# Builds a CUDA engine package for the update feed: the per-card quchen.exe and its CUDA libraries,
# packaged by packaging/package_engine.py. Compiling CUDA needs the toolkit, not a GPU, so a hosted runner can do it.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'JSON list of variants, e.g. ["cuda13","cuda12"]'
        default: '["cuda13"]'

permissions:
  contents: write

jobs:
  engine:
    name: ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@v4

      - name: Variant settings
        id: p
        shell: pwsh
        run: |
          switch ("${{ matrix.variant }}") {
            "cuda13" { $cuda = "13.3.0"; $archs = "75;86;89;120"; $sm60 = "OFF"; $mind = "580.65" }
            "cuda12" { $cuda = "12.9.0"; $archs = "60;61;70;75;80;86;89"; $sm60 = "ON"; $mind = "575.51" }
            default  { throw "unknown variant ${{ matrix.variant }}" }
          }
          "cuda=$cuda" >> $env:GITHUB_OUTPUT
          "archs=$archs" >> $env:GITHUB_OUTPUT
          "sm60=$sm60" >> $env:GITHUB_OUTPUT
          "mindriver=$mind" >> $env:GITHUB_OUTPUT

      - name: Visual Studio 2022 Build Tools (CUDA 12 does not support VS 2026)
        if: matrix.variant == 'cuda12'
        shell: pwsh
        run: choco install visualstudio2022buildtools --no-progress -y --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet --wait"

      - name: Use VS 2022 for cuda12
        if: matrix.variant == 'cuda12'
        shell: pwsh
        run: |
          $vcvars = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "VS 2022 Build Tools not installed" }
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Add-Content -Path $env:GITHUB_ENV -Value ($matches[1] + '=' + $matches[2]) }
          }

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.variant != 'cuda12'

      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ steps.p.outputs.cuda }}
          method: network
          use-github-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tools and the pinned llama.cpp
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements-build.txt
          python -c "import setup; print(setup.get_llama_cpp())"

      - name: Configure
        shell: pwsh
        run: |
          $ggml = Join-Path (Get-Location) "third_party\llama.cpp"
          Write-Host "llama.cpp at $ggml"
          $archs = "${{ steps.p.outputs.archs }}" -split ";"
          $real = ($archs | ForEach-Object { "$_-real" }) -join ";"
          $cudaArch = "$real;$($archs[-1])-virtual"
          Write-Host "CUDA architectures: $cudaArch"
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DQUCHEN_ENABLE_CUDA=ON -DQUCHEN_BUILD_TESTS=OFF -DQUCHEN_EXPERIMENTAL_SM60=${{ steps.p.outputs.sm60 }} -DQUCHEN_NATIVE_EXPERTS=ON -DQUCHEN_PORTABLE=ON -DQUCHEN_Q6K_EXPERTS=ON -DQUCHEN_MMQ_KQUANTS=ON "-DCMAKE_CUDA_ARCHITECTURES=$cudaArch" "-DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler" "-DQUCHEN_GGML_DIR=$ggml"

      - name: Build the engine
        shell: pwsh
        run: cmake --build build --target quchen -j 4

      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.variant }}
          path: build/quchen.exe
          if-no-files-found: error

      - name: Package
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern "project\(quchen VERSION ([0-9.]+)").Matches[0].Groups[1].Value
          if (-not $ver) { throw "no version in CMakeLists.txt" }
          $stage = "stage-${{ matrix.variant }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/quchen.exe $stage/
          $archs = "${{ steps.p.outputs.archs }}"
          @{ version = $ver; source = "build-engine.yml"; archs = $archs; cuda = "${{ steps.p.outputs.cuda }}"; portable = $true } | ConvertTo-Json | Set-Content "$stage/BUILD.json" -Encoding utf8
          $archArgs = @()
          foreach ($a in ($archs -split ";")) { $archArgs += @("--arch", "sm_$a") }
          $last = ($archs -split ";")[-1]
          python packaging/package_engine.py --src $stage --backend cuda --version $ver --out out-engine @archArgs --arch "compute_$last" --min-driver nvidia=${{ steps.p.outputs.mindriver }} --variant ${{ matrix.variant }} --platform windows-x86_64 --build-id "gha-$ver-${{ matrix.variant }}"
          Get-ChildItem out-engine -Recurse | Select-Object FullName,Length

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.variant }}
          path: out-engine/**
          if-no-files-found: error

  feed:
    name: publish the signed feed
    needs: engine
    if: needs.engine.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: artifacts

      - name: Sign and pack the engine package
        env:
          FEED_KEY: ${{ secrets.QUCHEN_FEED_KEY }}
        run: |
          mkdir -p key RELEASE/engine
          printf '%s' "$FEED_KEY" > key/feed-key.json
          ls -R artifacts | head -50
          for d in artifacts/*/*/; do
            echo "package: $d"
            python packaging/feed_tool.py sign-package "$d" --key key/feed-key.json
            python packaging/feed_tool.py pack-engine "$d" --out RELEASE/engine --url-prefix=
          done

      - name: Build the feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "release $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir .
          python packaging/feed_tool.py build-feed --out RELEASE --sequence 1 --key key/feed-key.json --engine RELEASE/engine --app-json latest.json
          ls -R RELEASE | head -40
          gh release upload "$TAG" RELEASE/quchen-feed.json RELEASE/quchen-feed.json.sig --clobber
          gh release upload "$TAG" RELEASE/engine/* --clobber
