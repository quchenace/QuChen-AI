name: Ship installer

# Puts the published Windows installer (and its signature, checksum, updater manifest and one-line script)
# into a workflow artifact, so it can be downloaded without github.com's asset CDN.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "release $TAG"
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.exe" --pattern "*.exe.sig" --pattern "SHA256SUMS.txt" --pattern "latest.json" --pattern "install-app.ps1" --pattern "install-app.cmd" --dir dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: quchen-windows-installer
          path: dist/**
          if-no-files-found: error
