# ============================================================
#  QuChen 免费网关配置（内置）
#  端点： http://127.0.0.1:4000/v1
#  鉴权： Authorization: Bearer <LITELLM_MASTER_KEY>
#
#  两层模型名：
#    · 每个上游一个名字（nemotron-3-ultra、cohere-north、flint …）—— 这样模型列表里能看到全部
#    · 四个别名组（deepseek-v4.1-flash / -think / fast / zero）—— 组内自动挑可用的
#  OpenRouter 需要免费账号的 key（.env 的 OPENROUTER_KEY_1）；Pollinations 完全免 key。
# ============================================================

model_list:
  - model_name: nemotron-3-ultra
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_KEY_1
    model_info: { note: "OpenRouter · Nemotron-3 Ultra 550B" }

  - model_name: cohere-north
    litellm_params:
      model: openai/cohere/north-mini-code:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_KEY_1
    model_info: { note: "OpenRouter · Cohere North Mini Code" }

