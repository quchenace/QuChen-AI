# ============================================================
#  QuChen 免费网关配置（内置）
#  端点： http://127.0.0.1:4000/v1
#  鉴权： Authorization: Bearer <LITELLM_MASTER_KEY>
#
#  这张表由 apps/host/server/gateway-config.mjs 生成，手改会在下次安装/启动时被覆盖。
#  两层模型名：
#    · 每个上游一个名字（nemotron-3-ultra、cohere-north、flint …）—— 这样模型列表里能看到全部
#    · 别名组（deepseek-v4.1-flash / -think / fast / zero / free）—— 组内自动挑可用的
#  Pollinations 完全免 key；OpenRouter 与插件目录里的 provider 需要 .env 里对应的 key，
#  没有 key 的 provider 不会写进这张表（写进去只会在用的时候报 401）。
# ============================================================
#
# 上游目录：@ebony-vinyl/dsh-our-free-model 2.8.3（76 个 provider / 507 个模型）
# 本次写入：内置 7 条 + 插件 1 个 provider / 1 个模型
# 目录内 1 条（opencode_zen）不按 provider 直写：它的 /zen/v1 对免费层 403、/inference 要官方客户端指纹。DSH 运行时由插件网关以 ofm/… 提供（QuChen 也给它备了 Bun，见 bun-runtime.mjs）

model_list:
  - model_name: "nemotron-3-ultra"
    litellm_params:
      model: "openai/nvidia/nemotron-3-ultra-550b-a55b:free"
      api_base: "https://openrouter.ai/api/v1"
      api_key: "os.environ/OPENROUTER_KEY_1"
    model_info: { note: "OpenRouter · Nemotron-3 Ultra 550B" }
