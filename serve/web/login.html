<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>登录 · QuChen AI</title>
<style>
  :root{
    --bg:#0d0f13; --panel:#15181f; --line:#252a34; --text:#e8ecf2; --dim:#8b93a3;
    --accent:#4d8dff; --accent-hover:#3f7aee; --err:#ff6b6b; --ok:#3ecf8e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 600px at 50% -10%, #1a2130 0%, var(--bg) 60%);
    color:var(--text); font:15px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:392px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:28px 26px 22px; box-shadow:0 24px 64px rgba(0,0,0,.45);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:20px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4d8dff,#8b5cf6);
        display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
  .brand b{font-size:16px; letter-spacing:.2px}
  .brand span{color:var(--dim); font-size:12px; margin-left:auto}
  h1{font-size:19px; margin:0 0 6px; font-weight:600}
  p.sub{margin:0 0 18px; color:var(--dim); font-size:13px}
  label{display:block; font-size:12px; color:var(--dim); margin:14px 0 6px}
  input{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:#0f1218; color:var(--text); font-size:14px; outline:none; transition:border-color .15s;
  }
  input:focus{border-color:var(--accent)}
  button{
    width:100%; margin-top:20px; padding:11px 12px; border:0; border-radius:10px;
    background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer;
  }
  button:hover{background:var(--accent-hover)}
  button:disabled{opacity:.55; cursor:default}
  .msg{margin-top:14px; font-size:13px; min-height:18px; color:var(--err)}
  .msg.ok{color:var(--ok)}
  .hint{margin-top:18px; padding-top:14px; border-top:1px solid var(--line); color:var(--dim); font-size:12px}
  .hint code{color:#a9b4c6; font-size:11.5px}
  .row{display:flex; gap:10px; align-items:center; margin-top:10px}
  .row .ghost{background:transparent;border:1px solid var(--line);color:var(--dim);margin-top:0;width:auto;padding:7px 12px;font-weight:500}
  .session{margin-top:14px;font-size:12.5px;color:var(--dim)}
  .session b{color:var(--text);font-weight:600}
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
  <div class="brand">
    <div class="logo">Q</div>
    <b>QuChen AI</b>
    <span id="appTag">登录墙</span>
  </div>
  <h1>登录 QuChen 账号</h1>
  <p class="sub">本机应用统一账号，登录一次，四端通用。</p>

  <label for="email">邮箱</label>
      <div id="qcTabs" style="display:flex;gap:6px;margin:0 0 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:4px">
        <button id="qtabLogin" type="button" style="flex:1;padding:9px 0;border:0;border-radius:8px;background:rgba(255,255,255,.10);color:#e8ecf2;font:14px/1 inherit;font-weight:600;cursor:pointer">登录</button>
        <button id="qtabRegister" type="button" style="flex:1;padding:9px 0;border:0;border-radius:8px;background:transparent;color:#8b93a3;font:14px/1 inherit;cursor:pointer">注册</button>
      </div>
  <input id="email" name="email" type="email" required autocomplete="username" placeholder="you@example.com">

  <label for="password">密码</label>
  <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="账户密码">

  <button id="submit" type="submit">登录</button>
  <div class="msg" id="msg"></div>
      <div id="qcRegPane" style="display:none">
        <div style="margin:2px 0 14px;font-size:12.5px;line-height:1.65;color:#8b93a3;text-align:left">
          用邮箱注册 QuChen 账号，四端通用；注册后如需审批，管理员通过即可登录。
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="qregEmail" type="email" placeholder="you@example.com" spellcheck="false" autocomplete="username"
            style="flex:1;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#e8ecf2;font:15px/1.4 inherit;outline:none;box-sizing:border-box">
          <button id="qregSend" type="button"
            style="white-space:nowrap;padding:12px 14px;border-radius:10px;border:1px solid rgba(90,150,255,.55);background:rgba(40,80,160,.28);color:#9dc0ff;font:14px/1 inherit;cursor:pointer">获取验证码</button>
        </div>
        <input id="qregCode" type="text" inputmode="numeric" maxlength="6" placeholder="邮箱验证码（6 位）" autocomplete="one-time-code" style="width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#e8ecf2;font:15px/1.4 inherit;outline:none;box-sizing:border-box">
        <input id="qregPassword" type="password" placeholder="设置密码（至少 8 位）" autocomplete="new-password" style="width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#e8ecf2;font:15px/1.4 inherit;outline:none;box-sizing:border-box">
        <input id="qregPassword2" type="password" placeholder="再输一次密码" autocomplete="new-password" style="width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#e8ecf2;font:15px/1.4 inherit;outline:none;box-sizing:border-box">
        <button id="qregSubmit" type="button"
          style="width:100%;margin-top:14px;padding:12px 14px;border-radius:10px;border:0;background:linear-gradient(135deg,#4d8dff,#3f7aee);color:#fff;font:15px/1 inherit;font-weight:600;cursor:pointer">注册账号</button>
      </div>
      <div style="margin-top:12px;font-size:12px;color:#7d8595;text-align:center">忘记密码？<a href="https://frp-any.com:19549/login.html#reset" target="_blank" rel="noopener" style="color:#6aa2ff;text-decoration:none;margin-left:2px">到官网账号中心重置</a></div>

  <div class="session" id="session"></div>

  <div class="hint">
    账号服务：<code id="base">http://127.0.0.1:8788</code><br>
    离线可用 7 天（服务端可调）；超期或密码变更后需要重新联网登录。
    <div class="row"><button class="ghost" type="button" id="signout">换账号 / 退出</button></div>
  </div>
</form>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg'), btn = $('submit');

  function say(text, ok) {
    msg.textContent = text || '';
    msg.className = 'msg' + (ok ? ' ok' : '');
  }

  function state() {
    return fetch('/api/auth/state', { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (st) {
        if (st.account_base) $('base').textContent = st.account_base;
        if (st.app) $('appTag').textContent = st.app.toUpperCase();
        if (st.email) {
          $('session').innerHTML = '上次登录：<b>' + String(st.email).replace(/[<>&]/g, '') + '</b>' +
            (st.offline_days ? '（离线 ' + st.offline_days + ' 天）' : '');
        }
        if (st.unlocked) { location.replace('/'); return; }
        if (st.why === 'grace_expired') say('离线宽限期已过，请联网重新登录。');
        if (st.why === 'revoked') say('会话已失效，请重新登录。');
        return st;
      })
      .catch(function () { say('无法读取本机登录状态，请确认 QuChen AI 服务在运行。'); });
  }

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var email = $('email').value.trim(), password = $('password').value;
    if (!email || !password) { say('请填写邮箱和密码。'); return; }
    btn.disabled = true; say('正在登录…', true);
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    }).then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
      .then(function (res) {
        if (!res.ok) {
          var e = (res.body && res.body.error) || {};
          var m = e.message || '登录失败';
          if (e.code === 'unreachable') m = '账号服务未启动：' + m;
          if (e.code === 'pending') m = '账号还在审批中，审批通过后即可登录。';
          if (e.code === 'bad_credentials') m = '邮箱或密码不正确。';
          say(m); btn.disabled = false; return;
        }
        say('登录成功，正在进入…', true);
        location.replace('/');
      })
      .catch(function () { say('登录请求失败，请确认 QuChen AI 服务在运行。'); btn.disabled = false; });
  });

  $('signout').addEventListener('click', function () {
    fetch('/api/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .then(function () { $('session').textContent = ''; say('已退出，请输入账号登录。', true); })
      .catch(function () { say('退出失败。'); });
  });

  state();
})();

/* ===== QuChen 注册视图：登录 / 注册切换 + 邮箱验证码注册 ===== */
(function () {
  function el(id) { return document.getElementById(id); }
  var pane = el('qcRegPane'), tabLogin = el('qtabLogin'), tabRegister = el('qtabRegister');
  if (!pane || !tabLogin || !tabRegister) return;

  function say(text, ok) {
    var m = el('msg');
    if (!m) return;
    m.textContent = text || '';
    m.style.color = ok ? '#3ecf8e' : '#ff6b6b';
  }
  function val(id) { var e = el(id); return e ? String(e.value || '').trim() : ''; }
  function paint(mode) {
    var reg = mode === 'register';
    ['email', 'password', 'submit'].forEach(function (id) {
      var e = el(id);
      if (e) e.style.display = reg ? 'none' : '';
    });
    var lab = document.querySelectorAll('label[for="email"], label[for="password"]');
    for (var i = 0; i < lab.length; i++) lab[i].style.display = reg ? 'none' : '';
    pane.style.display = reg ? '' : 'none';
    tabLogin.style.background = reg ? 'transparent' : 'rgba(255,255,255,.10)';
    tabLogin.style.color = reg ? '#8b93a3' : '#e8ecf2';
    tabLogin.style.fontWeight = reg ? '400' : '600';
    tabRegister.style.background = reg ? 'rgba(255,255,255,.10)' : 'transparent';
    tabRegister.style.color = reg ? '#e8ecf2' : '#8b93a3';
    tabRegister.style.fontWeight = reg ? '600' : '400';
    var f = el(reg ? 'qregEmail' : 'email');
    if (f) { try { f.focus(); } catch (e) {} }
    if (!reg) say('', true);
  }
  tabLogin.addEventListener('click', function () { paint('login'); });
  tabRegister.addEventListener('click', function () { paint('register'); });
  paint('login');

  function post(url, payload) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload || {})
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        return { ok: r.ok, body: b || {} };
      });
    });
  }
  function text(res) {
    var e = (res && res.body && res.body.error) || {};
    var map = {
      email_taken: '该邮箱已注册，请直接登录或找回密码。',
      no_code: '请先获取验证码。',
      code_expired: '验证码已过期，请重新获取。',
      code_wrong: '验证码不正确，请检查后重试。',
      code_locked: '验证码错误次数过多，请重新获取。',
      too_soon: '发送太频繁，请稍后再试。',
      smtp_failed: '验证码邮件发送失败，请稍后重试。',
      unreachable: '连不上账号服务，请确认网络后重试。',
      bad_request: '请检查填写内容。',
      weak_password: '密码需 8-128 位，请重新设置。',
      pending_approval: '账号待管理员审批，通过后即可登录。',
      bad_credentials: '邮箱或密码不正确。',
      locked: '密码错误次数过多，请稍后再试或重置密码。',
      too_many_devices: '设备数已达上限，请先在账号中心移出旧设备。'
    };
    return map[e.code] || e.message || '操作失败，请重试。';
  }

  var sendBtn = el('qregSend'), left = 0, timer = null;
  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
    left = 0;
    if (sendBtn) { sendBtn.disabled = false; sendBtn.style.opacity = '1'; sendBtn.textContent = '获取验证码'; }
  }
  if (sendBtn) {
    sendBtn.addEventListener('click', function () {
      var email = val('qregEmail');
      if (!email) { say('请先填写邮箱。'); el('qregEmail').focus(); return; }
      sendBtn.disabled = true; sendBtn.style.opacity = '.6'; sendBtn.textContent = '发送中…';
      post('/api/auth/send-code', { email: email, purpose: 'register' }).then(function (res) {
        if (res.ok) {
          left = Math.max(30, Number(res.body.resend_after) || 60);
          if (timer) clearInterval(timer);
          timer = setInterval(function () {
            left -= 1;
            if (left <= 0) { stopTimer(); return; }
            sendBtn.textContent = left + ' 秒后重发';
          }, 1000);
          sendBtn.style.opacity = '.6';
          say(res.body.message || '验证码已发送，10 分钟内有效。', true);
          el('qregCode').focus();
        } else { stopTimer(); say(text(res)); }
      }).catch(function () { stopTimer(); say('验证码发送失败，请确认 QuChen AI 服务在运行。'); });
    });
  }

  var submit = el('qregSubmit');
  function finish(msg, ok) {
    if (submit) { submit.disabled = false; submit.textContent = '注册账号'; }
    say(msg, ok);
  }
  if (submit) {
    submit.addEventListener('click', function () {
      var email = val('qregEmail'), code = val('qregCode');
      var pwd = el('qregPassword').value || '', pwd2 = el('qregPassword2').value || '';
      if (!email) { say('请填写邮箱。'); return; }
      if (!/^\d{6}$/.test(code)) { say('请填写邮箱收到的 6 位验证码。'); return; }
      if (pwd.length < 8) { say('密码至少 8 位。'); return; }
      if (pwd !== pwd2) { say('两次输入的密码不一致。'); return; }
      submit.disabled = true; submit.textContent = '注册中…';
      post('/api/auth/register', { email: email, code: code, password: pwd }).then(function (res) {
        if (!res.ok) { finish(text(res), false); return; }
        if (res.body.status === 'active') {
          say('注册成功，正在登录…', true);
          return post('/api/auth/login', { email: email, password: pwd }).then(function (r) {
            if (r.ok) { say('登录成功，正在进入…', true); location.replace('/'); return; }
            finish('注册成功，请用该邮箱登录。', true);
          }).catch(function () { finish('注册成功，请用该邮箱登录。', true); });
        }
        finish(res.body.message || '注册成功，等待管理员审批后即可登录。', true);
      }).catch(function () { finish('注册失败，请确认 QuChen AI 服务在运行。', false); });
    });
  }
})();

</script>
</body>
</html>
